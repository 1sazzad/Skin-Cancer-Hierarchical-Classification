protocol:
  name: phase02_flat_four_class_backbone_benchmark
  status: frozen_by_phase01_audit
  purpose: protocol_record_only_not_a_runnable_multi_backbone_config
  selection_partition: validation
  primary_selection_metric: macro_f1
  internal_test_policy: evaluation_only_after_configuration_selection

data:
  dataset: isic2019
  split_manifest: data/manifests/isic2019_train_val_test_split_seed42.csv
  split_seed: 42
  task: flat_four_class
  inclusion_policy: split_included=1 and include_stage_1=1
  class_to_index:
    non_malignant: 0
    melanoma: 1
    bcc: 2
    scc: 3

model:
  pretrained_weights: imagenet
  number_of_classes: 4
  dropout_probability: 0.2
  candidates:
    - densenet121
    - densenet169
    - resnet50
    - mobilenet_v3_large
    - efficientnet_b0
    - efficientnet_b2
    - efficientnet_b3

preprocessing:
  input_size: [224, 224]
  train:
    random_resized_crop:
      size: [224, 224]
      scale: [0.85, 1.0]
      ratio: [0.90, 1.10]
      interpolation: bilinear
      antialias: true
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
    rotation_degrees: 15.0
    rotation_interpolation: bilinear
    color_jitter:
      brightness: 0.10
      contrast: 0.10
      saturation: 0.10
      hue: 0.02
    dtype: float32
    scale_to_unit_range: true
  validation_and_test:
    resize: 256
    resize_interpolation: bilinear
    resize_antialias: true
    center_crop: [224, 224]
    dtype: float32
    scale_to_unit_range: true
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

loader:
  batch_size: 64
  weighted_sampler: false

training:
  seed: 42
  maximum_epochs: 30
  loss: cross_entropy
  class_weights: null
  amp_on_cuda: true
  optimizer:
    name: adamw
    learning_rate: 0.0003
    weight_decay: 0.0001
  scheduler:
    name: cosine_annealing
    t_max: configured_epoch_count
    minimum_learning_rate: 0.000001
  early_stopping_patience: 7
  checkpoint_selection_metric: validation_macro_f1

reporting:
  metrics:
    - accuracy
    - balanced_accuracy
    - macro_precision
    - macro_recall
    - macro_f1
    - weighted_f1
    - per_class_precision_recall_f1_support
    - confusion_matrix
  fixed_labels_include_absent_classes: true
  zero_division: 0
  special_attention:
    - scc_performance
    - malignant_to_non_malignant_errors
