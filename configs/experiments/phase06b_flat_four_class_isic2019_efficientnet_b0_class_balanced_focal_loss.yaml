experiment:
  status: ready_for_training
  research_stage: phase06b_flat_four_class
  run_name: phase06b_flat_four_class_isic2019_efficientnet_b0_class_balanced_focal_loss_seed42
  dataset: isic2019
  model: efficientnet_b0
  variant: class_balanced_focal_loss
  seed: 42

data:
  split_manifest: data/manifests/isic2019_train_val_test_split_seed42.csv
  task: flat_four_class
  label_source: diagnosis_canonical
  label_mapping_strategy: phase06_flat_four_class_v1
  inclusion_policy: split_included=1 and include_stage_1=1
  class_to_index:
    non_malignant: 0
    melanoma: 1
    bcc: 2
    scc: 3
  verify_image_paths: false

loader:
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last_train: false

model:
  architecture: efficientnet_b0
  pretrained_weights: imagenet
  number_of_classes: 4
  dropout_probability: 0.2

preprocessing:
  input_size: [224, 224]
  normalization: imagenet
  train_transform: locked_moderate_baseline
  validation_transform: deterministic_resize_256_center_crop_224
  internal_test_transform: deterministic_resize_256_center_crop_224

training:
  epochs: 30
  loss: class_balanced_focal_loss
  weighted_sampler: false
  class_weights:
    non_malignant: 0.1787906368601743
    melanoma: 0.4439450826095749
    bcc: 0.579994522856464
    scc: 2.797269757673787
  class_weight_source:
    partition: train
    split_seed: 42
    method: effective_number
    beta: 0.9999
    normalization: sum_to_number_of_classes
    total_samples: 17124
    number_of_classes: 4
    class_counts:
      non_malignant: 11193
      melanoma: 3164
      bcc: 2327
      scc: 440
  focal_loss: true
  focal_gamma: 2.0
  amp: true
  optimizer:
    name: adamw
    learning_rate: 0.0003
    weight_decay: 0.0001
  scheduler:
    name: cosine_annealing
    minimum_learning_rate: 0.000001
  selection_metric: macro_f1
  early_stopping_patience: 7
  full_training_allowed: true
