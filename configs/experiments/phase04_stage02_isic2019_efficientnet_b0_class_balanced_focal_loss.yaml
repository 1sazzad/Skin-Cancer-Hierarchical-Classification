experiment:
  status: ready_for_training
  research_stage: stage02
  run_name: stage02_isic2019_efficientnet_b0_class_balanced_focal_loss_seed42
  dataset: isic2019
  model: efficientnet_b0
  variant: class_balanced_focal_loss
  seed: 42

data:
  split_manifest: data/manifests/isic2019_train_val_test_split_seed42.csv
  task: stage_2
  class_to_index:
    melanoma: 0
    bcc: 1
    scc: 2
  verify_image_paths: false

loader:
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last_train: false

model:
  architecture: efficientnet_b0
  pretrained_weights: imagenet
  number_of_classes: 3
  dropout_probability: 0.2

training:
  epochs: 30
  loss: class_balanced_focal_loss
  weighted_sampler: false
  class_weights:
    melanoma: 0.3485376280807543
    bcc: 0.4553489231324597
    scc: 2.196113448786786
  class_weight_source:
    partition: train
    split_seed: 42
    method: effective_number
    beta: 0.9999
    normalization: sum_to_number_of_classes
    total_samples: 5931
    number_of_classes: 3
    class_counts:
      melanoma: 3164
      bcc: 2327
      scc: 440
  focal_loss: true
  focal_gamma: 2.0
  amp: true
  optimizer:
    name: adamw
    learning_rate: 0.0003
    weight_decay: 0.0001
  scheduler:
    name: cosine_annealing
    minimum_learning_rate: 0.000001
  selection_metric: macro_f1
  early_stopping_patience: 7
  full_training_allowed: true
