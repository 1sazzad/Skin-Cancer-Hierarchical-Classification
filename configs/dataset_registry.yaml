datasets:
  isic2019:
    full_name: "ISIC 2019 Challenge Training Dataset"
    role: "primary_development_internal_evaluation"
    status: "acquired_and_integrity_validated"
    enabled: true
    license: "CC-BY-NC"
    expected:
      image_count: 25331
      ground_truth_rows: 25331
      metadata_rows: 25331
    official_sources:
      training_images:
        url: "https://isic-archive.s3.amazonaws.com/challenges/2019/ISIC_2019_Training_Input.zip"
        local_path: "data/raw/isic2019/archives/ISIC_2019_Training_Input.zip"
      ground_truth:
        url: "https://isic-archive.s3.amazonaws.com/challenges/2019/ISIC_2019_Training_GroundTruth.csv"
        local_path: "data/raw/isic2019/metadata/ISIC_2019_Training_GroundTruth.csv"
      metadata:
        url: "https://isic-archive.s3.amazonaws.com/challenges/2019/ISIC_2019_Training_Metadata.csv"
        local_path: "data/raw/isic2019/metadata/ISIC_2019_Training_Metadata.csv"
    permitted_uses:
      - stage_1_development
      - stage_2_development
      - flat_baseline
      - hierarchical_model
      - internal_validation
      - internal_testing
      - calibration
      - explainability
      - efficiency_analysis

  emb:
    full_name: "Erasmus MC Melanoma Dataset"
    role: "unlicensed_identifier_index_provenance_only"
    status: "images_not_acquired_unlicensed_repository"
    enabled: false
    repository_commit: "3ec674f43e73cb08682b99b7fb996aca5f8040d8"
    license: "no_identifiable_license"
    restrictions:
      - no_emb_image_acquisition
      - no_atlas_image_use
      - no_training_or_evaluation_as_emb
    permitted_uses:
      - candidate_public_isic_identifier_index

  isic_stage03:
    full_name: "ISIC-derived melanoma T-category subset"
    role: "audited_standalone_stage_3_feasibility"
    status: "phase09_completed_locked"
    enabled: true
    source_metadata: "official_isic_archive_api_v2"
    source_identifier_provenance: "emb_csv_candidate_isic_ids_only"
    image_count: 848
    split_manifest: "data/manifests/emb_stage03_dermoscopic_split_seed42.csv"
    split_audit: "data/manifests/emb_stage03_dermoscopic_split_seed42.audit.json"
    label_order:
      - Tis
      - T1
      - T2
      - T3
      - T4
    licensing: "official_per_image_license_and_attribution_retained"
    permitted_uses:
      - locked_standalone_stage_3_feasibility_reporting
    restrictions:
      - internal_test_consumed
      - rerun_allowed_false
      - no_further_stage_3_tuning
      - not_integrated_three_stage_evidence
      - no_clinical_deployment_claim

  hiba:
    full_name: "Hospital Italiano de Buenos Aires - Skin Lesions Images (2019-2022)"
    role: "mandatory_external_evaluation"
    status: "candidate_pending_official_acquisition_audit"
    enabled: false
    official_release:
      collection: "ISIC collection 251"
      doi: "10.34970/587329"
      source_url: "https://api.isic-archive.com/collections/251/"
      api_v2_base_url: "https://api.isic-archive.com/api/v2"
      expected_image_count: 1616
      expected_specified_lesion_count: 1246
      expected_specified_patient_count: 623
    expected_raw_root: "data/external/hiba"
    acquisition_status: "phase10b_metadata_tooling_prepared_network_not_authorized"
    raw_metadata_jsonl: "data/external/hiba/metadata/collection_251_images.raw.jsonl"
    metadata_inventory_json: "data/external/hiba/metadata/collection_251_metadata_inventory.json"
    metadata_inventory_csv: "data/external/hiba/metadata/collection_251_metadata_inventory.csv"
    manifest: "data/manifests/hiba_dataset_manifest.csv"
    manifest_audit: "data/manifests/hiba_dataset_manifest.audit.json"
    checksum_manifest: "data/checksums/hiba_sha256.txt"
    primary_modality: "dermoscopic"
    evaluation_mode: "frozen_zero_shot"
    restrictions:
      - no_inference_before_official_metadata_licence_modality_label_integrity_and_overlap_approval
      - no_train_validation_test_split
      - clinical_and_non_dermoscopic_images_excluded
      - preserve_official_attribution_and_licence
      - metadata_before_images
      - explicit_network_authorization_required
      - collection_175_and_doi_10_34970_559884_prohibited
    forbidden_uses:
      - training
      - fine_tuning
      - architecture_selection
      - hyperparameter_tuning
      - threshold_selection
      - calibration_fitting
      - preprocessing_selection
      - checkpoint_selection

  mra_midas:
    full_name: "MRA-MIDAS"
    role: "optional_second_external_evaluation"
    status: "not_acquired"
    enabled: false
    activation_condition: "mandatory_experiments_completed"
    evaluation_mode: "frozen_zero_shot"
